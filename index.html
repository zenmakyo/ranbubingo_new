<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>乱舞ビンゴ</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>
    <span style="font-size: 2rem; ">第０回</span>
    <br>乱舞ビンゴ
    <br>
    <span id="name-container">
      <input type="text" id="player-name" 
       placeholder="名前を入力してください"
       style="width:90%; font-size:1.2rem; text-align:center; box-sizing:border-box; display:inline-block; font-family:sans-serif; -webkit-text-stroke: 0; font-weight: normal; color: black; background-color: white; border: 1px solid #767676; border-radius: 2px; padding: 3px 6px;">
    </span>
  </h1>

  <button id="external-btn" style="
    font-size: 1.4rem;
    position: absolute;
    top: 5%;
    left: 5%;
    padding: 0.2rem;
    background-color: #2e4e1e;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 1.8rem;
  " onclick="location.href='https://zenmakyo.github.io/ranbubingo_3-3/';">
    簡易版
  </button>
    
  <table id="bingo">
    <tbody></tbody>
  </table>

  <div class="button-container">
    <button id="random-btn">ランダム配置</button>
    <button id="reset-btn">リセット</button>
    <button id="confirm-btn">確定</button>
    <button id="load-btn">読込</button>
  </div>

  <script src="list.js"></script>
  <script src="script.js"></script>
</body>
</html>
